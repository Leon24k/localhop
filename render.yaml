services:
  - type: web
    name: localhop-relay
    runtime: docker
    plan: free
    healthCheckPath: /_localhop/health
    envVars:
      - key: RUST_LOG
        value: localhop_server=info
      - key: LOCALHOP_RATE_LIMIT_RPS
        value: "100"
      # Optional: uncomment to lock your private relay behind a token
      # - key: LOCALHOP_AUTH_TOKEN
      #   generateValue: true
