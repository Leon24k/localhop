name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --workspace --bins --target ${{ matrix.target }}

      - name: Package archives (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          for bin in localhop localhop-server; do
            tar -C "target/${{ matrix.target }}/release" -czf "dist/${bin}-${TAG}-${{ matrix.target }}.tar.gz" "${bin}"
          done

      - name: Package archives (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $TAG = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($bin in @("localhop", "localhop-server")) {
            Compress-Archive -Path "target/${{ matrix.target }}/release/${bin}.exe" -DestinationPath "dist/${bin}-${TAG}-${{ matrix.target }}.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release & Homebrew Formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS and Homebrew Formula
        working-directory: artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum localhop-* > SHA256SUMS.txt
          VER="${TAG#v}"
          SHA_MAC_ARM=$(sha256sum "localhop-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          SHA_MAC_X64=$(sha256sum "localhop-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          SHA_LIN_ARM=$(sha256sum "localhop-${TAG}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          SHA_LIN_X64=$(sha256sum "localhop-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')

          cat > localhop.rb <<EOF
          class Localhop < Formula
            desc "Zero-GC Rust localhost tunnel with live HTTP and webhook inspector"
            homepage "https://leon24k.github.io/localhop/"
            version "${VER}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Leon24k/localhop/releases/download/${TAG}/localhop-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              else
                url "https://github.com/Leon24k/localhop/releases/download/${TAG}/localhop-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Leon24k/localhop/releases/download/${TAG}/localhop-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LIN_ARM}"
              else
                url "https://github.com/Leon24k/localhop/releases/download/${TAG}/localhop-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LIN_X64}"
              end
            end

            def install
              bin.install "localhop"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/localhop --version")
            end
          end
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  publish-crates:
    name: Publish to crates.io (Optional)
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v') && secrets.CARGO_REGISTRY_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p localhop-protocol
          sleep 15
          cargo publish -p localhop
          cargo publish -p localhop-server

  publish-npm:
    name: Publish to npm (Optional)
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v') && secrets.NPM_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish localhop npm wrapper
        working-directory: npm/localhop
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
