[workspace]
resolver = "2"
members = [
    "crates/localhop-protocol",
    "crates/localhop-server",
    "crates/localhop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Leon24k/localhop"

[workspace.dependencies]
localhop-protocol = { path = "crates/localhop-protocol" }
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Fast incremental builds
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
